name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install lrzsz (XMODEM/ZMODEM tests)
        run: sudo apt-get update && sudo apt-get install -y lrzsz

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
