name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install lrzsz (XMODEM/ZMODEM tests)
        run: sudo apt-get update && sudo apt-get install -y lrzsz

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Every push to main goes live on Cloudflare Workers once the tests pass.
      - name: Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e39390f735b92b562c7b19e9f83855a9
