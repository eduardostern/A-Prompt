name = "a-prompt"
main = "worker/index.ts"
compatibility_date = "2026-10-21"
workers_dev = true
preview_urls = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Only the telnet relay runs the Worker script; everything else is static.
run_worker_first = ["/relay"]
